name: CI

on:
  pull_request:
    branches: [balloads-classic, main]
  push:
    branches: [balloads-classic]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # balloads-classic has no package-lock.json yet (see docs/QUALITY_ASSURANCE.md, gaps).
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      # next build writes next-env.d.ts (git-ignored), which declares the image module types tsc needs.
      - name: Build
        run: npm run build
      - name: Type check
        run: npm run typecheck
